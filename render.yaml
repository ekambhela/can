# Render Blueprint — https://render.com/docs/blueprint-spec
# Connect this repo on Render (New > Blueprint) and it provisions the service.
services:
  - type: web
    name: karkive
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    # Custom domain (registered on GoDaddy). Render provisions these and a
    # free TLS cert once the GoDaddy DNS records point at this service.
    domains:
      - karkive.com
      - www.karkive.com
